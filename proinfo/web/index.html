<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Live Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="dashboard">
  <!-- #rail is injected here by shell.js -->
  <div id="content">
  <header>
    <h1>Dashboard</h1>
    <span class="tag">Live view — devices from the Parser and live feeds</span>
    <span class="spacer"></span>
    <span class="pill" id="stat-devices">0 devices</span>
    <span class="pill" id="stat-packets">0 packets</span>
    <span class="pill dead" id="stat-conn">connecting…</span>
  </header>

  <main>
    <!-- CENTER: big map on top, devices + packet table along the bottom ---- -->
    <section id="center">
      <div id="map"></div>
      <div id="bottom">
        <aside id="sidebar">
          <div class="dev-head">
            <h2>Devices</h2>
            <button id="clear-btn" class="ghost mini">🗑 Clear</button>
          </div>
          <input id="dev-search" placeholder="filter devices…" />
          <ul id="devices"><li class="empty">No devices yet</li></ul>
        </aside>

        <div id="packets">
          <div class="packets-bar">
            <span>Packets</span>
            <span class="spacer"></span>
            <button id="cols-btn" class="ghost mini">⚙ Columns</button>
          </div>
          <div class="packets-scroll">
            <table>
              <thead id="packet-head"></thead>
              <tbody id="packet-rows"><tr><td class="empty">Waiting for packets…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- RIGHT: packet detail ---------------------------------------------- -->
    <aside id="detail">
      <h2>Packet detail</h2>
      <div id="detail-body"><p class="empty">Select a packet to inspect it</p></div>
    </aside>
  </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="shell.js"></script>
  <script src="app.js"></script>
</body>
</html>
