[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proinfo"
version = "1.1.20"
description = "ProInfo - Unified telematics protocol parser, visualizer & relay utility"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Shahbaz Khan", email = "shahbaz.khan@mapmyindia.com" }]
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mqtt = ["aiomqtt>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
proinfo = "proinfo.cli:main"

[tool.setuptools.packages.find]
include = ["proinfo*"]

[tool.setuptools.package-data]
proinfo = ["web/*", "qc/profiles/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
