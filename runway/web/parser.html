<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Packet parser</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="parser">
  <!-- the rail and top bar are built around #content by shell.js -->
  <div id="content">
    <header>
      <h1>Packet parser</h1>
      <span class="tag">Decode device packets, one tab per device. Paste hex or the device's own text, one packet or many; Ctrl+Enter decodes.</span>
      <span class="spacer"></span>
      <span class="pill" id="stat-tabs">1 tab</span>
    </header>

    <div id="tabbar"></div>
    <div id="panels"></div>
  </div>

  <!-- One independent parser per tab is cloned from this template. -->
  <template id="tab-tpl">
    <div class="panel">
      <div class="parsebar">
        <label>Packets</label>
        <textarea class="hexin" spellcheck="false" placeholder="000F33353633…   $MMI,V2.2.0,…*BC   $GPRMC,123519,A,…*6A"
                  title="Click a field or signal to highlight its bytes here"></textarea>
        <div class="controls">
          <!-- always-visible essentials -->
          <span class="seg">Protocol
            <select class="proto-sel" title="Auto-detect reads the bytes; pick a protocol to force one">
              <option value="auto" selected>Auto-detect</option>
            </select>
          </span>
          <span class="seg">Order
            <select class="sort-sel">
              <option value="feed">Feed order</option>
              <option value="asc">Oldest first</option>
              <option value="desc">Newest first</option>
            </select>
          </span>
          <span class="seg">Signature
            <select class="sig-sel"><option value="">None</option></select>
            <button class="sig-apply ghost" type="button">Apply</button>
          </span>
          <span class="parse-msg"></span>
          <span class="spacer"></span>
          <button class="more-btn ghost" type="button"><span data-icon="more"></span>More</button>
          <button class="decode-btn" type="button" title="Decode (Ctrl+Enter)"><span data-icon="play"></span>Decode</button>

          <!-- overflow dropdown -->
          <div class="more-panel">
            <span class="seg">View
              <select class="view-sel">
                <option value="grid" selected>Grid</option>
                <option value="grouped">By record</option>
                <option value="flat">Flat</option>
              </select>
            </span>
            <span class="seg">Transport
              <select class="transport-sel">
                <option value="tcp" selected>TCP</option>
                <option value="udp">UDP</option>
              </select>
            </span>
            <span class="seg">Time zone
              <select class="tz-sel">
                <option value="ist" selected>IST (UTC+5:30)</option>
                <option value="utc">UTC / GMT</option>
                <option value="dubai">Dubai (UTC+4)</option>
                <option value="singapore">Singapore (UTC+8)</option>
                <option value="london">London</option>
                <option value="ny">New York</option>
                <option value="local">Browser local</option>
                <option value="custom">Custom…</option>
              </select>
              <span class="tz-custom" style="display:none">
                UTC
                <select class="tz-sign"><option value="+">+</option><option value="-">−</option></select>
                <input class="tz-h" type="number" min="0" max="14" value="5" title="Hours" /> :
                <input class="tz-m" type="number" min="0" max="59" value="30" title="Minutes" />
              </span>
            </span>
            <div class="more-actions">
              <input type="file" class="file-input" accept=".hex,.txt,.log,.csv,.dump" hidden />
              <button class="upload-btn ghost" type="button" title="A file of packets, one per line"><span data-icon="upload"></span>Upload</button>
              <button class="sample-btn ghost" type="button"><span data-icon="file"></span>Load sample</button>
              <button class="download-btn ghost" type="button"><span data-icon="download"></span>CSV</button>
              <button class="clear-btn ghost" type="button"><span data-icon="x"></span>Clear</button>
            </div>
          </div>
        </div>
      </div>

      <div class="parser-main ui-split">
        <div class="fields"><p class="empty">No packets decoded yet</p></div>
        <div class="parser-right">
          <div class="pane-head">
            <span class="pane-title">Summary</span>
            <span class="spacer"></span>
            <button class="ui-icon-btn" type="button" data-fold-toggle></button>
          </div>
          <div class="summary"><p class="empty">No summary yet</p></div>
          <div class="map-wrap">
            <div class="map-head"><span>Map</span><button class="map-fold ghost mini" type="button"></button></div>
            <div class="parser-map"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="shell.js"></script>
  <script src="parser.js"></script>
</body>
</html>
