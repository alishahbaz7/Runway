<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Archive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="archive">
  <!-- #rail is injected here by shell.js -->
  <div id="content">
    <header>
      <h1>Archive</h1>
      <span class="tag">Every stored packet, one file per device per day</span>
    </header>

    <div id="arch-bar">
      <label class="imu-fld">Device
        <select id="arch-device"><option value="">All devices</option></select>
      </label>
      <span class="spacer"></span>
      <span id="arch-total" class="muted"></span>
      <button id="arch-refresh" class="ghost mini">⟳ Refresh</button>
    </div>

    <section class="arch-card">
      <h2 class="arch-h">Storage <span id="arch-free" class="muted"></span></h2>
      <table class="arch-table" id="arch-store"></table>
    </section>

    <section id="arch-replays-wrap" class="arch-card" hidden>
      <h2 class="arch-h">Replays <span id="arch-replays-count" class="muted"></span></h2>
      <table class="arch-table" id="arch-replays"></table>
    </section>

    <section class="arch-card">
      <h2 class="arch-h">Days <span id="arch-days-count" class="muted"></span></h2>
      <table class="arch-table" id="arch-days"></table>
      <p id="arch-empty" class="empty" hidden></p>
    </section>
  </div>

  <script src="shell.js"></script>
  <script src="archive.js"></script>
</body>
</html>
