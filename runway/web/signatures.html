<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Signatures</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="signatures">
  <!-- the rail and top bar are built around #content by shell.js -->
  <div id="content">
    <header>
      <h1>Signatures</h1>
      <span class="tag">The decode-signature repository: how a parameter's bytes split into signals, and which device's CAN frames each one decodes</span>
    </header>

    <!-- add a signature, and the actions on the one in view -->
    <div id="sig-addbar" class="ui-strip">
      <span class="addbar-label">Add signature</span>
      <input id="sig-name" placeholder="mg_zs_ev" spellcheck="false" />
      <input type="file" id="sig-file" accept=".json,application/json" hidden />
      <button id="sig-upload" class="ghost" type="button"><span data-icon="upload"></span>Choose file</button>
      <span id="sig-file-name"></span>
      <span class="spacer"></span>
      <span id="sig-msg"></span>
      <button id="sig-download" class="ghost" type="button" disabled><span data-icon="download"></span>Download</button>
      <button id="sig-delete" class="ghost danger" type="button" disabled><span data-icon="trash"></span>Delete</button>
      <button id="sig-clear" class="ghost" type="button" disabled><span data-icon="x"></span>Clear</button>
      <button id="sig-save" type="button">Save</button>
    </div>

    <main id="sig-main" class="ui-split">
      <!-- the repository, in a pane that folds away -->
      <div id="sig-list-pane" data-fold="signatures-list" data-fold-title="Signatures">
        <div class="pane-head">
          <span class="pane-title">Signatures</span><span id="sig-count" class="ui-count"></span>
          <span class="spacer"></span>
          <button class="ui-icon-btn" type="button" data-fold-toggle></button>
        </div>
        <div class="list-search"><input id="sig-search" placeholder="Search" /></div>
        <ul id="sig-list"><li class="empty">No signatures yet</li></ul>
      </div>

      <!-- the one in view -->
      <div id="sig-view">
        <div id="sig-view-head"><p class="empty">No signature selected</p></div>
        <div id="sig-view-body"></div>
      </div>
    </main>
  </div>

  <script src="shell.js"></script>
  <script src="signatures.js"></script>
</body>
</html>
