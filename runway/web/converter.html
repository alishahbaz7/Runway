<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Converter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="converter">
  <!-- the rail and top bar are built around #content by shell.js -->
  <div id="content">
    <header>
      <h1>Converter</h1>
      <span class="tag">A vehicle signature (CanPlus XML): view and edit its signals, export them as JSON and DBC</span>
    </header>

    <div id="conv-addbar" class="ui-strip">
      <input type="file" id="conv-file" accept=".xml,text/xml" hidden />
      <button id="conv-upload" class="ghost" type="button"><span data-icon="upload"></span>Upload XML</button>
      <span id="conv-veh" class="conv-veh"></span>
      <input id="conv-search" placeholder="Search signals" />
      <span class="spacer"></span>
      <span id="conv-msg"></span>
      <button id="conv-json" class="ghost" type="button" disabled><span data-icon="download"></span>Export JSON</button>
      <button id="conv-dbc" class="ghost" type="button" disabled><span data-icon="download"></span>Export DBC</button>
    </div>

    <main id="conv-main">
      <div id="conv-empty" class="empty conv-empty">No CanPlus file loaded</div>
      <div id="conv-table-wrap" hidden>
        <table id="conv-table" class="conv-table">
          <thead>
            <tr>
              <th>VarID</th><th>Name</th><th>CAN&nbsp;ID</th><th>Start&nbsp;bit</th>
              <th>Len</th><th>Order</th><th>Signed</th><th>Mult</th><th>Div</th>
              <th>Offset</th><th>Dec</th><th>Unit</th><th>Function</th>
            </tr>
          </thead>
          <tbody id="conv-rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="shell.js"></script>
  <script src="converter.js"></script>
</body>
</html>
