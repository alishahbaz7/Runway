<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Logs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="logs">
  <!-- the rail and top bar are built around #content by shell.js -->
  <div id="content">
    <header>
      <h1>Logs</h1>
      <span class="tag">Runway's own log: errors and activity (data/runway.log)</span>
    </header>

    <div id="log-bar" class="ui-strip">
      <input id="log-search" placeholder="Search" />
      <select id="log-source">
        <option value="activity">Activity</option>
        <option value="errors">Errors and warnings (kept)</option>
      </select>
      <select id="log-level">
        <option value="">All levels</option>
        <option value="ERROR">Errors</option>
        <option value="WARN">Warnings and errors</option>
      </select>
      <label class="ui-toggle"><span>Auto-refresh</span><span class="switch"><input type="checkbox" id="log-auto" /><span class="slider"></span></span></label>
      <span class="spacer"></span>
      <span id="log-info" class="muted"></span>
      <button id="log-refresh" class="ghost" type="button"><span data-icon="refresh"></span>Refresh</button>
      <button id="log-download" class="ghost" type="button"><span data-icon="download"></span>Download</button>
      <button id="log-clear" class="ghost danger" type="button"><span data-icon="trash"></span>Clear</button>
    </div>

    <pre id="log-view" class="empty">Loading</pre>
  </div>

  <script src="shell.js"></script>
  <script src="logs.js"></script>
</body>
</html>
