<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Protocols</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="protocols">
  <!-- the rail and top bar are built around #content by shell.js -->
  <div id="content">
    <header>
      <h1>Protocols</h1>
      <span class="tag">The protocol repository: parser files in any format (.py, .json, .yaml…), moved between systems by export and import</span>
    </header>

    <!-- add a protocol, and the actions on the one in view -->
    <div id="proto-addbar" class="ui-strip">
      <span class="addbar-label">Add protocol</span>
      <input id="proto-name" placeholder="teltonika.py" spellcheck="false" />
      <input type="file" id="proto-file" accept=".py,.json,.yaml,.yml,.toml,.txt,.md,.csv,.xml,.cfg,.ini" hidden />
      <button id="proto-upload" class="ghost" type="button"><span data-icon="upload"></span>Choose file</button>
      <span id="proto-file-name"></span>
      <input type="file" id="proto-import-file" accept=".zip" hidden />
      <button id="proto-import" class="ghost" type="button" title="Import a .zip exported from another system"><span data-icon="upload"></span>Import .zip</button>
      <span class="spacer"></span>
      <span id="proto-msg"></span>
      <button id="proto-edit" class="ghost" type="button" disabled><span data-icon="edit"></span>Edit</button>
      <button id="proto-download" class="ghost" type="button" disabled><span data-icon="download"></span>Download</button>
      <button id="proto-export-all" class="ghost" type="button" title="Every protocol as one .zip"><span data-icon="download"></span>Export all</button>
      <button id="proto-delete" class="ghost danger" type="button" disabled><span data-icon="trash"></span>Delete</button>
      <button id="proto-clear" class="ghost" type="button" disabled><span data-icon="x"></span>Clear</button>
      <button id="proto-save" type="button">Save</button>
    </div>

    <main id="proto-main" class="ui-split">
      <!-- the repository, in a pane that folds away -->
      <div id="proto-list-pane" data-fold="protocols-list" data-fold-title="Protocols">
        <div class="pane-head">
          <span class="pane-title">Protocols</span><span id="proto-count" class="ui-count"></span>
          <span class="spacer"></span>
          <button class="ui-icon-btn" type="button" data-fold-toggle></button>
        </div>
        <div class="list-search"><input id="proto-search" placeholder="Search" /></div>
        <ul id="proto-list"><li class="empty">No protocols yet</li></ul>
      </div>

      <!-- the one in view: a table for JSON, code for anything else, or the editor -->
      <div id="proto-view">
        <div id="proto-view-head"><p class="empty">No protocol selected</p></div>
        <div id="proto-view-body"></div>
      </div>
    </main>
  </div>

  <script src="shell.js"></script>
  <script src="protocols.js"></script>
</body>
</html>
