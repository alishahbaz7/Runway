<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Runway · Protocols</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="protocols">
  <!-- #rail is injected here by shell.js -->
  <div id="content">
    <header>
      <h1>Protocols</h1>
      <span class="tag">Protocol repository — transferable parser files in any format (.py, .json, .yaml…)</span>
    </header>

    <!-- full-width add band -->
    <div id="proto-addbar">
      <span class="addbar-label">Add protocol</span>
      <input id="proto-name" placeholder="name with extension (e.g. teltonika.py)" />
      <input type="file" id="proto-file" accept=".py,.json,.yaml,.yml,.toml,.txt,.md,.csv,.xml,.cfg,.ini" style="display:none" />
      <button id="proto-upload" class="ghost">⤒ Choose file</button>
      <span id="proto-file-name"></span>
      <input type="file" id="proto-import-file" accept=".zip" style="display:none" />
      <button id="proto-import" class="ghost" title="Import a .zip exported from another system">⤒ Import .zip</button>
      <span class="spacer"></span>
      <span id="proto-msg"></span>
      <button id="proto-edit" class="ghost" disabled>✎ Edit</button>
      <button id="proto-download" class="ghost" disabled>⤓ Download</button>
      <button id="proto-export-all" class="ghost" title="Export every protocol as one .zip">⤓ Export all</button>
      <button id="proto-delete" class="ghost danger" disabled>✕ Delete</button>
      <button id="proto-clear" class="ghost" disabled>✕ Clear</button>
      <button id="proto-save">Save</button>
    </div>

    <main id="proto-main">
      <!-- LEFT: repository list + search -->
      <aside id="proto-list-pane">
        <input id="proto-search" placeholder="🔍 find in repository…" />
        <ul id="proto-list"><li class="empty">No protocols yet</li></ul>
      </aside>

      <!-- RIGHT: large preview / editor -->
      <section id="proto-view">
        <div id="proto-view-head"><p class="empty">Upload, select or add a protocol to preview it</p></div>
        <div id="proto-view-body"></div>
      </section>
    </main>
  </div>

  <script src="shell.js"></script>
  <script src="protocols.js"></script>
</body>
</html>
