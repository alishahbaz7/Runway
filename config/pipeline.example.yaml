# Runway - declarative pipeline config (REFERENCE / ROADMAP M5)
#
# This is the planned format for `runway run config.yaml`, which will wire one or more
# Source -> Codec -> Sinks pipelines without writing code. Today, pipelines are started
# via the CLI (`runway replay/listen`) and the dashboard/API; this file documents the
# intended shape so plugin authors can design toward it.
#
# Each pipeline names one source, one codec (or "auto"), and any number of sinks.
# `type:` values are the plugin `name` attributes (see `runway codecs`, etc.).

pipelines:
  # 1) Live GT06 fleet: listen, show on dashboard, persist, and relay raw to platform.
  - name: gt06-fleet
    source:
      type: tcp_server
      host: 0.0.0.0
      port: 5050
    codec: gt06
    sinks:
      - type: memory_store          # feeds the dashboard
      - type: ws_broadcast          # live push to browsers
      - type: sqlite_store
        path: data/gt06.db
      - type: tcp_relay             # transparent pass-through to your platform
        host: platform.example.com
        port: 6000
        mode: raw

  # 2) Teltonika devices, normalized and forwarded to an HTTP ingest API.
  - name: teltonika-api
    source:
      type: tcp_server
      host: 0.0.0.0
      port: 5027
    codec: teltonika
    sinks:
      - type: memory_store
      - type: ws_broadcast
      - type: webhook
        url: https://platform.example.com/api/telemetry

  # 3) Offline analysis: replay a capture through auto-detection into the dashboard.
  - name: replay-capture
    source:
      type: file_replay
      path: samples/capture.bin
      fmt: auto
      delay: 0.05
    codec: auto
    sinks:
      - type: memory_store
      - type: ws_broadcast
