# Runway - local & cloud deployment.
#   docker compose up --build
#   dashboard/API -> http://localhost:8080   |   device TCP listener -> :5050

services:
  runway:
    build: .
    container_name: runway
    ports:
      - "8080:8080"      # dashboard + REST + WebSocket
      - "5050:5050"      # TCP device listener (start from dashboard or override CMD)
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

